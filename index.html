<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔍 StokCheck — проверка подлинности вещей</title>
    <style>
        :root {
            --bg: #0b0b14;
            --card: #15152a;
            --card2: #101a2b;
            --accent: #e94560;
            --accent2: #0f3460;
            --gold: #f0c040;
            --green: #2ecc71;
            --red: #e74c3c;
            --text: #e0e0e8;
            --text2: #9a9ab0;
            --border: #2a2a40;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            --radius: 16px;
            --radius-sm: 10px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 20px;
            background-image:
                radial-gradient(ellipse at 30% 30%, rgba(233, 68, 96, 0.07) 0%, transparent 60%),
                radial-gradient(ellipse at 70% 70%, rgba(15, 52, 96, 0.12) 0%, transparent 60%),
                radial-gradient(ellipse at 50% 50%, rgba(240, 192, 64, 0.04) 0%, transparent 70%);
            background-attachment: fixed;
        }

        .container {
            width: 100%;
            max-width: 820px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .header {
            text-align: center;
            padding: 10px 0;
        }
        .header .logo {
            font-size: 2.6em;
            font-weight: 800;
            letter-spacing: -1px;
            background: linear-gradient(135deg, #f0c040 0%, #e94560 50%, #f0c040 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 4px;
        }
        .header .subtitle {
            color: var(--text2);
            font-size: 0.95em;
            letter-spacing: 0.5px;
        }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 28px 30px;
            box-shadow: var(--shadow);
            transition: var(--transition);
        }
        .card:hover {
            border-color: #3a3a55;
        }
        .card-title {
            font-size: 1.2em;
            font-weight: 700;
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #fff;
        }
        .card-title .icon {
            font-size: 1.4em;
        }

        .upload-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 14px;
        }
        @media (max-width: 600px) {
            .upload-grid {
                grid-template-columns: 1fr 1fr;
            }
            .upload-grid .upload-zone:last-child {
                grid-column: span 2;
            }
        }
        .upload-zone {
            position: relative;
            aspect-ratio: 1 / 1;
            border: 2px dashed var(--border);
            border-radius: var(--radius-sm);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition);
            background: var(--card2);
            overflow: hidden;
            min-height: 120px;
        }
        .upload-zone:hover {
            border-color: var(--accent);
            background: #1a1a38;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(233, 68, 96, 0.15);
        }
        .upload-zone.has-image {
            border-style: solid;
            border-color: var(--green);
            background: #0a1a0f;
        }
        .upload-zone .placeholder {
            text-align: center;
            pointer-events: none;
            transition: var(--transition);
        }
        .upload-zone .placeholder .emoji {
            font-size: 2.2em;
            display: block;
            margin-bottom: 4px;
        }
        .upload-zone .placeholder .label {
            font-size: 0.8em;
            color: var(--text2);
            font-weight: 500;
        }
        .upload-zone img.preview {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: var(--radius-sm);
        }
        .upload-zone .remove-btn {
            position: absolute;
            top: 6px;
            right: 6px;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: rgba(231, 76, 60, 0.9);
            border: none;
            color: #fff;
            font-size: 14px;
            cursor: pointer;
            z-index: 5;
            display: none;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
        }
        .upload-zone.has-image .remove-btn {
            display: flex;
        }
        .upload-zone .remove-btn:hover {
            background: #c0392b;
            transform: scale(1.1);
        }
        input[type="file"] {
            display: none;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .input-group label {
            font-weight: 600;
            font-size: 0.9em;
            color: #c0c0d0;
            letter-spacing: 0.3px;
        }
        .input-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }
        @media (max-width: 500px) {
            .input-row {
                grid-template-columns: 1fr;
            }
        }
        input[type="text"],
        textarea {
            width: 100%;
            padding: 12px 16px;
            border-radius: var(--radius-sm);
            border: 1.5px solid var(--border);
            background: var(--card2);
            color: #fff;
            font-size: 0.95em;
            font-family: inherit;
            transition: var(--transition);
            resize: vertical;
            outline: none;
        }
        input[type="text"]:focus,
        textarea:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(233, 68, 96, 0.1);
        }
        textarea {
            min-height: 80px;
        }
        input::placeholder,
        textarea::placeholder {
            color: #555;
        }

        .btn-analyze {
            width: 100%;
            padding: 16px 24px;
            border-radius: var(--radius-sm);
            border: none;
            font-size: 1.1em;
            font-weight: 700;
            cursor: pointer;
            letter-spacing: 0.5px;
            transition: var(--transition);
            background: linear-gradient(135deg, #e94560 0%, #c0392b 100%);
            color: #fff;
            box-shadow: 0 6px 24px rgba(233, 68, 96, 0.35);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 14px;
        }
        .btn-analyze:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(233, 68, 96, 0.5);
            filter: brightness(1.1);
        }
        .btn-analyze:active {
            transform: scale(0.97);
        }
        .btn-analyze:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            pointer-events: none;
            filter: grayscale(30%);
        }
        .btn-analyze .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 2.5px solid #fff;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        .btn-analyze.loading .spinner {
            display: inline-block;
        }
        .btn-analyze.loading .btn-text {
            display: none;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .error-message {
            background: rgba(231, 76, 60, 0.15);
            border: 1px solid #e74c3c;
            color: #e74c3c;
            padding: 12px 18px;
            border-radius: var(--radius-sm);
            font-weight: 600;
            margin-top: 12px;
            display: none;
        }
        .error-message.show {
            display: block;
        }

        .progress-container {
            display: none;
            margin-top: 16px;
        }
        .progress-container.active {
            display: block;
        }
        .progress-bar-bg {
            background: var(--card2);
            border-radius: 20px;
            height: 8px;
            overflow: hidden;
            margin-bottom: 8px;
        }
        .progress-bar-fill {
            height: 100%;
            border-radius: 20px;
            background: linear-gradient(90deg, #e94560, #f0c040);
            width: 0%;
            transition: width 0.4s ease;
        }
        .progress-steps {
            display: flex;
            justify-content: space-between;
            font-size: 0.75em;
            color: var(--text2);
        }
        .progress-steps .step {
            opacity: 0.4;
            transition: var(--transition);
        }
        .progress-steps .step.done {
            opacity: 1;
            color: var(--green);
        }
        .progress-steps .step.active {
            opacity: 1;
            color: var(--accent);
            font-weight: 600;
        }

        .result-card {
            display: none;
            background: var(--card);
            border: 2px solid var(--border);
            border-radius: var(--radius);
            padding: 28px 30px;
            box-shadow: var(--shadow);
            animation: fadeInUp 0.5s ease;
        }
        .result-card.show {
            display: block;
        }
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .verdict-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            border-radius: 30px;
            font-weight: 800;
            font-size: 1.1em;
            letter-spacing: 0.5px;
            margin-bottom: 16px;
        }
        .verdict-badge.original {
            background: rgba(46, 204, 113, 0.2);
            color: #2ecc71;
            border: 2px solid #2ecc71;
        }
        .verdict-badge.fake {
            background: rgba(231, 76, 60, 0.2);
            color: #e74c3c;
            border: 2px solid #e74c3c;
        }
        .verdict-badge.uncertain {
            background: rgba(240, 192, 64, 0.2);
            color: #f0c040;
            border: 2px solid #f0c040;
        }
        .confidence-bar {
            width: 100%;
            height: 10px;
            border-radius: 10px;
            background: var(--card2);
            margin: 10px 0 16px;
            overflow: hidden;
        }
        .confidence-fill {
            height: 100%;
            border-radius: 10px;
            transition: width 1s ease;
        }
        .confidence-fill.high {
            background: #2ecc71;
        }
        .confidence-fill.medium {
            background: #f0c040;
        }
        .confidence-fill.low {
            background: #e74c3c;
        }
        .detail-section {
            margin-top: 14px;
            padding: 14px;
            background: var(--card2);
            border-radius: var(--radius-sm);
            border-left: 3px solid var(--accent);
        }
        .detail-section h4 {
            margin-bottom: 8px;
            color: #fff;
            font-size: 0.95em;
        }
        .detail-section p,
        .detail-section li {
            font-size: 0.85em;
            color: var(--text2);
            line-height: 1.6;
        }
        .detail-section ul {
            list-style: disc;
            padding-left: 18px;
        }
        .wiki-snippet {
            font-style: italic;
            color: #b0b0c0;
            font-size: 0.83em;
            margin-top: 6px;
            padding: 10px;
            background: rgba(240, 192, 64, 0.06);
            border-radius: 6px;
            border-left: 2px solid #f0c040;
        }
        .wiki-snippet a {
            color: #f0c040;
        }
        .factors-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 8px;
        }
        .factor-tag {
            font-size: 0.8em;
            padding: 4px 12px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid #3a3a55;
        }
        .factor-tag.positive {
            border-color: #2ecc71;
            color: #2ecc71;
        }
        .factor-tag.negative {
            border-color: #e74c3c;
            color: #e74c3c;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">🔍 StokCheck</div>
            <div class="subtitle">AI-проверка подлинности по фото, биркам и Википедии</div>
        </div>

        <div class="card" id="formCard">
            <div class="card-title"><span class="icon">📸</span> Загрузите до 3 фото</div>
            <div class="upload-grid" id="uploadGrid">
                <label class="upload-zone" for="file1" id="zone1">
                    <div class="placeholder"><span class="emoji">👟</span><span class="label">Фото вещи</span></div>
                    <img class="preview" id="preview1" alt="" style="display:none;">
                    <button class="remove-btn" id="remove1" title="Удалить">✕</button>
                </label>
                <input type="file" id="file1" accept="image/*">

                <label class="upload-zone" for="file2" id="zone2">
                    <div class="placeholder"><span class="emoji">🏷️</span><span class="label">Фото бирки</span></div>
                    <img class="preview" id="preview2" alt="" style="display:none;">
                    <button class="remove-btn" id="remove2" title="Удалить">✕</button>
                </label>
                <input type="file" id="file2" accept="image/*">

                <label class="upload-zone" for="file3" id="zone3">
                    <div class="placeholder"><span class="emoji">📷</span><span class="label">Доп. фото</span></div>
                    <img class="preview" id="preview3" alt="" style="display:none;">
                    <button class="remove-btn" id="remove3" title="Удалить">✕</button>
                </label>
                <input type="file" id="file3" accept="image/*">
            </div>

            <div style="margin-top:20px;" class="input-row">
                <div class="input-group">
                    <label>📝 Название вещи</label>
                    <input type="text" id="itemName" placeholder="Например: Nike Air Jordan 1, Levi's 501...">
                </div>
                <div class="input-group">
                    <label>🏷️ Бренд</label>
                    <input type="text" id="brandName" placeholder="Например: Nike, Gucci, Adidas...">
                </div>
            </div>
            <div class="input-group" style="margin-top:14px;">
                <label>📋 Описание (детали, где куплено, цена, подозрения)</label>
                <textarea id="description" placeholder="Опишите вещь: состояние, где приобретена, примерная цена, что вызывает сомнения..."></textarea>
            </div>

            <div class="error-message" id="photoError">
                ⚠️ Ошибка: необходимо загрузить хотя бы одно фото вещи или бирки.
            </div>

            <button class="btn-analyze" id="analyzeBtn" onclick="startAnalysis()">
                <span class="btn-text">🔬 Проверить подлинность</span>
                <span class="spinner"></span>
            </button>

            <div class="progress-container" id="progressContainer">
                <div class="progress-bar-bg"><div class="progress-bar-fill" id="progressFill"></div></div>
                <div class="progress-steps">
                    <span class="step" id="step1">📸 Анализ фото</span>
                    <span class="step" id="step2">🌐 Поиск в Википедии</span>
                    <span class="step" id="step3">🧠 Сравнение данных</span>
                    <span class="step" id="step4">✅ Вердикт</span>
                </div>
            </div>
        </div>

        <div class="result-card" id="resultCard">
            <div id="resultContent"></div>
        </div>
    </div>

    <script>
        (function() {
            // ==================== УПРАВЛЕНИЕ ФОТО ====================
            const zones = [
                { zoneId: 'zone1', fileId: 'file1', previewId: 'preview1', removeId: 'remove1' },
                { zoneId: 'zone2', fileId: 'file2', previewId: 'preview2', removeId: 'remove2' },
                { zoneId: 'zone3', fileId: 'file3', previewId: 'preview3', removeId: 'remove3' },
            ];

            zones.forEach(({ zoneId, fileId, previewId, removeId }) => {
                const zone = document.getElementById(zoneId);
                const fileInput = document.getElementById(fileId);
                const preview = document.getElementById(previewId);
                const removeBtn = document.getElementById(removeId);

                zone.addEventListener('click', (e) => {
                    if (e.target === removeBtn || removeBtn.contains(e.target)) return;
                    fileInput.click();
                });

                fileInput.addEventListener('change', () => {
                    const file = fileInput.files[0];
                    if (file) {
                        const reader = new FileReader();
                        reader.onload = (ev) => {
                            preview.src = ev.target.result;
                            preview.style.display = 'block';
                            zone.classList.add('has-image');
                            zone.querySelector('.placeholder').style.display = 'none';
                        };
                        reader.readAsDataURL(file);
                    }
                });

                removeBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    fileInput.value = '';
                    preview.src = '';
                    preview.style.display = 'none';
                    zone.classList.remove('has-image');
                    zone.querySelector('.placeholder').style.display = '';
                    hideError();
                });
            });

            function hideError() {
                document.getElementById('photoError').classList.remove('show');
            }

            function showPhotoError() {
                document.getElementById('photoError').classList.add('show');
            }

            // ==================== ОСНОВНАЯ ЛОГИКА ====================
            window.startAnalysis = async function() {
                const itemName = document.getElementById('itemName').value.trim();
                const brandName = document.getElementById('brandName').value.trim();
                const description = document.getElementById('description').value.trim();
                const files = [
                    document.getElementById('file1').files[0],
                    document.getElementById('file2').files[0],
                    document.getElementById('file3').files[0],
                ].filter(f => f !== null);

                // Проверка наличия фото
                if (files.length === 0) {
                    showPhotoError();
                    document.getElementById('resultCard').classList.remove('show');
                    document.getElementById('progressContainer').classList.remove('active');
                    return;
                }
                hideError();

                if (!itemName && !brandName) {
                    alert('⚠️ Пожалуйста, введите хотя бы название вещи или бренд.');
                    return;
                }

                const resultCard = document.getElementById('resultCard');
                resultCard.classList.remove('show');
                document.getElementById('resultContent').innerHTML = '';

                const btn = document.getElementById('analyzeBtn');
                btn.classList.add('loading');
                btn.disabled = true;

                const progressContainer = document.getElementById('progressContainer');
                progressContainer.classList.add('active');
                const progressFill = document.getElementById('progressFill');
                const steps = ['step1', 'step2', 'step3', 'step4'];
                steps.forEach(s => document.getElementById(s).className = 'step');

                // Шаг 1: Анализ фото
                updateProgress(10, 'step1', 'active');
                await sleep(700);
                const photoAnalysis = analyzePhotos(files);
                updateProgress(30, 'step1', 'done');

                // Шаг 2: Википедия
                updateProgress(35, 'step2', 'active');
                const searchQuery = brandName || extractBrand(itemName);
                const wikiData = await searchWikipedia(searchQuery);
                updateProgress(70, 'step2', 'done');

                // Шаг 3: Глубокое сравнение
                updateProgress(75, 'step3', 'active');
                await sleep(500);
                const comparisonResult = deepCompare(photoAnalysis, wikiData, itemName, brandName, description);
                updateProgress(90, 'step3', 'done');

                // Шаг 4: Вердикт
                updateProgress(95, 'step4', 'active');
                await sleep(300);
                updateProgress(100, 'step4', 'done');

                await sleep(200);
                progressContainer.classList.remove('active');
                btn.classList.remove('loading');
                btn.disabled = false;

                displayResult(comparisonResult, wikiData, photoAnalysis);
                resultCard.classList.add('show');
                resultCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
            };

            function updateProgress(percent, stepId, status) {
                document.getElementById('progressFill').style.width = percent + '%';
                const stepEl = document.getElementById(stepId);
                stepEl.className = 'step ' + status;
            }

            function sleep(ms) {
                return new Promise(resolve => setTimeout(resolve, ms));
            }

            function extractBrand(text) {
                const brands = ['Nike', 'Adidas', 'Gucci', 'Prada', 'Louis Vuitton', 'Balenciaga', 'Levi\'s',
                    'Jordan', 'Yeezy', 'Supreme', 'Off-White', 'Dior', 'Chanel', 'Hermès', 'Burberry',
                    'Versace', 'Fendi', 'Calvin Klein', 'Tommy Hilfiger', 'Ralph Lauren', 'Stone Island',
                    'Moncler', 'Canada Goose', 'The North Face', 'Patagonia', 'Carhartt', 'Vans', 'Converse',
                    'New Balance', 'Asics', 'Puma', 'Reebok', 'Under Armour', 'Bape', 'Essentials'
                ];
                const lower = text.toLowerCase();
                for (const b of brands) {
                    if (lower.includes(b.toLowerCase())) return b;
                }
                return text.split(' ')[0] || 'бренд';
            }

            function analyzePhotos(files) {
                const totalSize = files.reduce((sum, f) => sum + f.size, 0);
                const avgSize = totalSize / files.length;
                const qualityScore = Math.min(1, avgSize / 400000); // 400KB ~ хорошее качество
                const randomNoise = 0.65 + Math.random() * 0.3;
                const photoScore = (qualityScore * 0.5 + randomNoise * 0.5);

                const hasTagPhoto = files.some(f => f.name.toLowerCase().includes('birka') || f.name.toLowerCase().includes('tag') || f.name.toLowerCase().includes('бирк'));
                const verySmallFiles = files.filter(f => f.size < 20000).length;

                return {
                    fileCount: files.length,
                    totalSize,
                    avgSize,
                    qualityScore,
                    photoScore,
                    hasEnoughPhotos: files.length >= 2,
                    hasTagPhoto,
                    verySmallFiles,
                    details: files.map(f => ({
                        name: f.name,
                        size: (f.size / 1024).toFixed(1) + ' KB',
                        type: f.type
                    }))
                };
            }

            async function searchWikipedia(query) {
                try {
                    const url = `https://ru.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(query + ' бренд')}&format=json&origin=*&srlimit=3`;
                    const response = await fetch(url);
                    const data = await response.json();
                    const searchResults = data.query?.search || [];

                    if (searchResults.length > 0) {
                        const pageId = searchResults[0].pageid;
                        const extractUrl =
                            `https://ru.wikipedia.org/w/api.php?action=query&pageids=${pageId}&prop=extracts|info&exintro=1&explaintext=1&inprop=url&format=json&origin=*`;
                        const extractResp = await fetch(extractUrl);
                        const extractData = await extractResp.json();
                        const page = extractData.query?.pages?.[pageId];
                        const extract = page?.extract || '';
                        const pageUrl = page?.fullurl || '';

                        return {
                            found: true,
                            query,
                            searchResults: searchResults.map(r => ({ title: r.title, snippet: r.snippet })),
                            extract: extract.substring(0, 2000),
                            pageUrl,
                            pageId,
                            title: page?.title || searchResults[0].title,
                        };
                    }
                    return { found: false, query, searchResults: [], extract: '', pageUrl: '' };
                } catch (e) {
                    console.warn('Wikipedia API error:', e);
                    return { found: false, query, searchResults: [], extract: '', pageUrl: '', error: e.message };
                }
            }

            function deepCompare(photoAnalysis, wikiData, itemName, brandName, description) {
                const brand = brandName || extractBrand(itemName);
                const fullText = (itemName + ' ' + brandName + ' ' + description).toLowerCase();
                let score = 0.5;
                const pros = [];
                const cons = [];

                // Фото-признаки
                if (photoAnalysis.fileCount >= 2) {
                    score += 0.08;
                    pros.push('Несколько фото (детальный осмотр)');
                }
                if (photoAnalysis.hasTagPhoto) {
                    score += 0.1;
                    pros.push('Обнаружено фото бирки/этикетки');
                }
                if (photoAnalysis.photoScore > 0.75) {
                    score += 0.07;
                    pros.push('Хорошее качество изображений');
                }
                if (photoAnalysis.verySmallFiles > 0) {
                    score -= 0.12;
                    cons.push('Слишком маленький размер файлов (возможно скриншоты)');
                }
                if (photoAnalysis.fileCount === 1) {
                    cons.push('Только одно фото – мало данных для проверки');
                }

                // Текстовые маркеры
                const positiveMarkers = ['оригинал', 'гарантия', 'чек', 'сертификат', 'stockx', 'аутентификация', 'фирменный', 'официальный'];
                const negativeMarkers = ['дешево', 'скидка', 'распродажа', 'копия', 'реплика', 'подделка', 'алиэкспресс', 'недорого', 'аналог', 'no name'];

                positiveMarkers.forEach(w => {
                    if (fullText.includes(w)) {
                        score += 0.04;
                        pros.push(`Упоминание "${w}" в описании`);
                    }
                });
                negativeMarkers.forEach(w => {
                    if (fullText.includes(w)) {
                        score -= 0.07;
                        cons.push(`Подозрительное слово "${w}"`);
                    }
                });

                // Анализ Википедии
                if (wikiData.found) {
                    score += 0.06;
                    pros.push('Бренд найден в Википедии');
                    const extractLower = wikiData.extract.toLowerCase();
                    // Проверка упоминания типа вещи
                    const itemTypes = ['кроссовки', 'sneakers', 'джинсы', 'jeans', 'сумка', 'bag', 'куртка', 'jacket', 'часы', 'watch', 'обувь', 'shoes'];
                    let typeMatch = false;
                    itemTypes.forEach(t => {
                        if (fullText.includes(t) && extractLower.includes(t)) {
                            typeMatch = true;
                        }
                    });
                    if (typeMatch) {
                        score += 0.05;
                        pros.push('Тип вещи совпадает с информацией из Википедии');
                    } else if (itemName) {
                        // Проверка модели
                        if (extractLower.includes(itemName.toLowerCase())) {
                            score += 0.07;
                            pros.push('Модель упоминается в статье Википедии');
                        } else {
                            cons.push('Модель не найдена в Википедии (возможно, редкая)');
                        }
                    }
                } else {
                    cons.push('Бренд отсутствует в Википедии (малоизвестный?)');
                }

                // Дополнительная эвристика
                if (description.length > 30) {
                    score += 0.02;
                    pros.push('Подробное описание (больше контекста)');
                }

                // Случайный интеллектуальный шум (симуляция нейросети)
                const aiNoise = (Math.random() - 0.48) * 0.18;
                score += aiNoise;

                score = Math.max(0.05, Math.min(0.97, score));
                const confidencePercent = Math.round(score * 100);

                let verdict, verdictClass;
                if (score >= 0.7) {
                    verdict = '✅ ОРИГИНАЛ';
                    verdictClass = 'original';
                } else if (score >= 0.4) {
                    verdict = '⚠️ ТРЕБУЕТСЯ ПРОВЕРКА';
                    verdictClass = 'uncertain';
                } else {
                    verdict = '❌ ВЕРОЯТНО ПОДДЕЛКА';
                    verdictClass = 'fake';
                }

                return {
                    score,
                    confidencePercent,
                    verdict,
                    verdictClass,
                    brand,
                    itemName,
                    pros,
                    cons,
                    photoAnalysis,
                    wikiData
                };
            }

            function displayResult(comparison, wikiData, photoAnalysis) {
                const {
                    confidencePercent,
                    verdict,
                    verdictClass,
                    brand,
                    itemName,
                    pros,
                    cons
                } = comparison;

                let confidenceClass = 'low';
                if (confidencePercent >= 70) confidenceClass = 'high';
                else if (confidencePercent >= 40) confidenceClass = 'medium';

                const prosHTML = pros.length ? pros.map(p => `<span class="factor-tag positive">✅ ${p}</span>`).join('') : '<span class="factor-tag">—</span>';
                const consHTML = cons.length ? cons.map(c => `<span class="factor-tag negative">❌ ${c}</span>`).join('') : '<span class="factor-tag">—</span>';

                const wikiHTML = wikiData.found ?
                    `
                <div class="detail-section">
                  <h4>🌐 Википедия</h4>
                  <p><strong>Статья:</strong> ${wikiData.title || wikiData.query}</p>
                  <div class="wiki-snippet">${wikiData.extract.substring(0, 700)}${wikiData.extract.length > 700 ? '...' : ''}</div>
                  ${wikiData.pageUrl ? `<p style="margin-top:6px;"><a href="${wikiData.pageUrl}" target="_blank" style="color:#f0c040;">📖 Читать полностью →</a></p>` : ''}
                </div>` :
                    `
                <div class="detail-section">
                  <h4>🌐 Википедия</h4>
                  <p>⚠️ Информация о бренде <strong>"${brand}"</strong> не найдена.</p>
                </div>`;

                document.getElementById('resultContent').innerHTML = `
                <div class="verdict-badge ${verdictClass}">${verdict}</div>
                <p style="color:#c0c0d0;margin-bottom:6px;">Уверенность: <strong>${confidencePercent}%</strong></p>
                <div class="confidence-bar">
                  <div class="confidence-fill ${confidenceClass}" style="width:${confidencePercent}%;"></div>
                </div>

                <div class="detail-section">
                  <h4>📊 Факторы анализа</h4>
                  <p><strong>Положительные признаки:</strong></p>
                  <div class="factors-list">${prosHTML}</div>
                  <p style="margin-top:10px;"><strong>Отрицательные признаки:</strong></p>
                  <div class="factors-list">${consHTML}</div>
                </div>

                ${wikiHTML}

                <div class="detail-section" style="border-left-color:#f0c040;">
                  <h4>💡 Рекомендации</h4>
                  <ul>
                    ${confidencePercent >= 70 
                      ? '<li>✅ Высокая вероятность оригинальности. Проверьте дополнительные голограммы, швы, упаковку.</li>'
                      : confidencePercent >= 40 
                        ? '<li>⚠️ Результат неоднозначный. Сверьте серийный номер с официальной базой бренда.</li>'
                        : '<li>❌ Много признаков подделки. Сравните с эталонными фото, обратитесь к экспертам.</li>'}
                    <li>🔍 Для точного результата загрузите чёткие фото бирки, швов, коробки.</li>
                    <li>📸 StokCheck анализирует косвенные признаки и информацию из Википедии – окончательное решение за вами.</li>
                  </ul>
                </div>

                <p style="text-align:center;margin-top:14px;color:#555;font-size:0.75em;">
                  ⚠️ Сервис носит информационный характер и не гарантирует 100% точность.
                </p>
              `;
            }
        })();
    </script>
